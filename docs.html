<!DOCTYPE html>
<html lang="en">
  <head>
      <title>Scribe Notes - Doc</title>
      
      <link rel="stylesheet" href="styles.css">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
      <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
      <link rel="icon" href="images/logo-dm.svg" type="image/svg+xml">
  </head>
  <body>
      <div id="bodyContainer">
          <div id="notifsContainer">
              <!--
              <div class="notifDiv">
                  <div class="notifDivInner">
                      <p>Notification adsfaasdfasdfasdfasdfasdfasdfasdfasdfsdf adsfdsaddasfasd  title</p>
                      <button class="notifClose"><img src="images/close.svg"></button>
                  </div>
                  <div class="notifBar"></div>
              </div>
              <div class="notifDiv">
                  <div class="notifDivInner">
                      <p>Level up! You are now level 123!</p>
                      <button class="notifClose"><img src="images/close.svg"></button>
                  </div>
                  <div class="notifBar"></div>
              </div>
            -->
          </div>
          <div id="navbar">
              <div id="navTitleContainer">
                  <img>
                  <h2 id="navTitle" class="header" onclick='updateBooksCollapse();window.location.href = "index.html";'>Scribe Notes</h2>
              </div>
              
              <div class="navbox button" onclick='updateBooksCollapse();window.location.href = "index.html";'>
                  <img src="images/homeicon.svg" class="navimg" draggable="false">
                  <h3 id="homeLink" class="navlink">Home</h3>
              </div>
              <div class="navbox button" onclick='updateBooksCollapse();window.location.href = "scribe.html";'>
                  <img src="images/scribe.svg" class="navimg" draggable="false">
                  <h3 id="homeLink" class="navlink">Scribe</h3>
              </div>
              <div class="navbox button" onclick='updateBooksCollapse();window.location.href = "study.html";'>
                  <img src="images/edit-pencil%20.svg" class="navimg" draggable="false">
                  <h3 id="studyLink" class="navlink">Study</h3>
              </div>
              <div class="navbox button" onclick="toggleBooksCollapse()">
                  <img src="images/book-stack.svg" class="navimg" draggable="false">
                  <h3 id="booksLink" class="navlink">Books</h3>
                  <img src="images/nav-arrow-up.svg" id="booksCollapseArrow">
              </div>
              <div id="booksCollapse">
              </div>
              <div id="newDocPrompt">
                  <input type="text" placeholder="New Doc Name" id="newDocInput" value="">
                  <div id="newDocPromptButtons">
                      <button id="newDocSubmit" onclick="newDocNameSubmit()" class="button">Submit</button>
                      <button id="newDocCancel" onclick="toggleNewDocPrompt();creatingNewDoc=!creatingNewDoc;" class="button">X</button>
                  </div>
              </div>
              <div id="newFolderPrompt">
                  <input type="text" placeholder="New Folder Name" id="newFolderInput" value="">
                  <div id="newFolderPromptButtons">
                      <button id="newFolderSubmit" onclick="newFolderNameSubmit()" class="button">Submit</button>
                      <button id="newFolderCancel" onclick="toggleNewFolderPrompt();creatingNewFolder=!creatingNewFolder;" class="button">X</button>
                  </div>
              </div>
              <div id="settingsLink" class="navbox button" onclick="toggleSettings()">
                  <img src="images/settings.svg" class="navimg" draggable="false">
                  <h3 id="homeLink" class="navlink">Settings</h3>
              </div>
          </div>
          <div id="content">
              <h1 id="docTitle" class="header">Title</h1>
              <div id="toolbar"></div>
              <div id="textEditor">
                  <div id="textBox"></div>
              </div>
          </div>
      </div>
      <div id="docOptionsContainer">
          <button id="toggleDocOptions" onclick="toggleDocOptions()"><img src="images/nav-arrow-up.svg"></button>
          <div id="docOptions" class="closed">
              <h4>Cards in this doc</h4>
              <table id="docOptionsCardsTable">
                  <thead>
                      <tr id="docOptionsThead">
                          <th>Term</th>
                          <th>Definition</th>
                      </tr>
                  </thead>
                  <tbody>
                  </tbody>
              </table>
              <div class="button" id="studyCardsButton">Study this doc</div>
          </div>
      </div>
      <div id="settingsDiv" class="disabled">
          <div id="settingsDivInner">
              <h3>Settings</h3>
              <div id="settingsTheme">
                  <h4>Theme</h4>
                  <button><img src="images/light.svg">Bright Mode</button>
                  <button><img src="images/dark.svg">Dark Mode</button>
              </div>
              <div id="settingsDyslexia">
                  <h4>Dyslexia-friendly Font</h4>
                  <label class="toggle-switch">
                      <input type="checkbox" id="settingsDyslexiaInput">
                      <span class="toggle-switch-slider"></span>
                  </label>
              </div>
              <div id="settingsPort">
                  <h4>Import or Export Your Data</h4>
                  <textarea id="settingsPortInput"
                                placeholder=" - To export your data, click the reload button below and save the resulting text somewhere safe.&#10 - To import your data, paste it in here and click the checkmark button below."></textarea>
                  <div id="settingsPortButtons">
                      <button id="settingsPortReload">
                          <img src="images/reload.svg">
                      </button>
                      <button id="settingsPortConfirm">
                          <img src="images/checkmark.svg">
                      </button>
                  </div>
              </div>
              <button id="settingsExit" onclick="toggleSettings('off')"> X Close</button>
          </div>
      </div>    
      <script src="https://unpkg.com/string-similarity/umd/string-similarity.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
      <script src="docs.js"></script>
  </body>
</html>
